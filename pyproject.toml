[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "speechloom"
version = "0.1.1"
description = "端到端语音模型研究工具：音频编码、因果解码、联合训练与流式协议。"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Chen Yuxuan"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
model = ["torch>=2.5,<3"]
dev = ["build>=1.2", "hatchling>=1.26", "pytest>=8,<10", "pytest-cov>=5", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/speechloom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["model: CPU neural model integration tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
